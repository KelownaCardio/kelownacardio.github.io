name: Build index.html
on:
  push:
    paths:
      - 'src/**'
      - 'build.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Rebuild index.html from src/
        run: node build.js
      - name: Commit rebuilt index.html + version.json + sw.js (only if changed)
        run: |
          git config user.name  "kgh-build-bot"
          git config user.email "kgh-build-bot@users.noreply.github.com"
          # Stage all three build outputs. version.json is generated by
          # build.js alongside index.html; `git add` handles it whether it is
          # a new (untracked) file on first run or a modification thereafter.
          #
          # 2026-09-02: sw.js JOINS THE LIST. build.js now stamps its
          # CACHE_VERSION with the build hash, and without staging it here
          # that stamp was computed and then thrown away on every run — the
          # service worker's cache key had been stuck at v3.26 while the app
          # reached v5.10, so ocr_offline.js (cache-first in SHELL) was
          # frozen on every device at whatever it first cached.
          git add index.html version.json sw.js
          # `git diff --cached --quiet` is true when nothing is staged, which
          # correctly covers BOTH "no changes" and "version.json newly added"
          # — unlike `git diff --quiet` on the worktree, which ignores
          # untracked files and would miss version.json's first appearance.
          if git diff --cached --quiet; then
            echo "index.html, version.json and sw.js already up to date — nothing to commit."
          else
            git commit -m "Build: regenerate index.html + version.json + sw.js from src/ [skip ci]"
            git push
            echo "index.html, version.json and sw.js rebuilt and pushed."
          fi
